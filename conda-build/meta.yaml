{% set pyproject = load_file_data("../pyproject.toml", from_recipe_dir=True) %}

package:
  name: im-course-tools
  version: {{ pyproject.get("project").get("version") }}

source:
  git_url: https://github.com/munch-group/im-tools.git

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python
  entry_points:
    - im = im_tools.cli:main

requirements:
  host:
    # Take the interpreter bound from pyproject rather than leaving it open:
    # unconstrained, conda-build picks the newest python there is, and pip then
    # refuses to install into it if requires-python does not reach that far.
    - python {{ pyproject.get("project").get("requires-python") }}
    - pip
    - setuptools>=65.0
  run:  # your library dependencies
    - python {{ pyproject.get("project").get("requires-python") }}
    {% for dep in pyproject.get("project").get("dependencies") %}
    - {{ dep.lower() }}
    {% endfor %}

channels:  # channels for your library dependencies
  - conda-forge

dependencies:   # keep this block with only these packages
  - anaconda-client
  - conda-build>=25.1.3 # from 25 the output file is a .conda not .tar.bz2
  - conda-verify
  - conda-package-handling
  # - conda-forge/label/python_rc::_python_rc # Dummy package to force selection of python_rc channel when channel_priority is set to strict

test:
  imports:
    - im_tools

about:
  home: https://github.com/munch-group/im-tools.git
  license: MIT
  dev_url: https://github.com/munch-group/im-tools.git
  doc_url: https://munch-group.org/im-tools
